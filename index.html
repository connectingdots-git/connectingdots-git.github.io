<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photographs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9EAE6; --ink: #1A1C1A; --muted: #6B6F68; --veil: rgba(20,21,20,.94);
    --pad: clamp(1rem, 4vw, 3rem);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1C1D1B; --ink: #E6E7E2; --muted: #8E928A; --veil: rgba(10,10,10,.96); color-scheme: dark; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 300; }
  header { padding: clamp(2rem, 8vw, 6rem) var(--pad) 2rem; max-width: 70rem; }
  h1 { font-weight: 600; font-size: clamp(2.5rem, 9vw, 7rem); line-height: .9; letter-spacing: -.03em; }
  header p { margin-top: 1rem; color: var(--muted); max-width: 32rem; line-height: 1.5; }
  header a { color: inherit; }

  nav { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; padding: 0 var(--pad); }
  nav:empty { display: none; }
  nav a { color: var(--muted); text-decoration: none; padding: .25rem 0; }
  nav a:hover, nav a[aria-current] { color: var(--ink); }
  nav a[aria-current] { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .3em; }
  #albums { font-size: clamp(1.125rem, 2.2vw, 1.5rem); font-weight: 600; letter-spacing: -.01em; }
  #tags { font-size: .9375rem; padding-top: .5rem; }
  .filters { padding-bottom: 1.75rem; }

  main { columns: 3 18rem; column-gap: .75rem; padding: 0 var(--pad) 4rem; }
  main button { display: block; width: 100%; padding: 0; margin-bottom: .75rem; border: 0; background: none; cursor: zoom-in; break-inside: avoid; }
  main img { display: block; width: 100%; height: auto; }
  a:focus-visible, main button:focus-visible, dialog button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  .empty { color: var(--muted); }

  dialog { border: 0; padding: 0; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; background: var(--veil); color: #E6E7E2; }
  dialog[open] { display: grid; place-items: center; }
  dialog img { max-width: 92vw; max-height: 80vh; object-fit: contain; }
  dialog .bar { position: fixed; bottom: 1rem; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .25rem 1.5rem; padding: 0 1rem; }
  dialog button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: .5rem; }
  dialog .count { color: #8E928A; font-variant-numeric: tabular-nums; }
  #caption { position: fixed; top: 1rem; left: 0; right: 0; text-align: center; color: #8E928A; font-size: .9375rem; }
  #caption a { color: #E6E7E2; text-decoration: none; margin: 0 .4rem; }
  #caption a:hover { text-decoration: underline; }
  footer { padding: 0 var(--pad) 3rem; color: var(--muted); font-size: .875rem; }
  @media (prefers-reduced-motion: no-preference) { main img { transition: opacity .2s; } }
</style>
</head>
<body>
<header>
  <h1>Your Name</h1>
  <p>Photographs, mostly of light falling on ordinary things. Write a line about yourself here.</p>
</header>

<div class="filters">
  <nav id="albums" aria-label="Albums"></nav>
  <nav id="tags" aria-label="Tags"></nav>
</div>

<main id="grid"><p class="empty">Loading photos…</p></main>

<dialog id="viewer" aria-label="Photo viewer">
  <div id="caption"></div>
  <img id="big" alt="">
  <div class="bar">
    <button id="prev" aria-label="Previous photo">Previous</button>
    <span class="count" id="count"></span>
    <button id="next" aria-label="Next photo">Next</button>
    <button id="share" aria-label="Copy link to this photo">Copy link</button>
    <button id="close" aria-label="Close viewer">Close</button>
  </div>
</dialog>

<footer>© Your Name</footer>

<script>
// ── Settings ─────────────────────────────────────────────
// Photos are read from the "photos" folder; each subfolder becomes an album.
// Tags come from photos/tags.txt (optional).
// If auto-detection fails (e.g. custom domain), fill in USER and REPO.
const FOLDER = "photos";
let USER = "", REPO = "", BRANCH = "";   // BRANCH: leave empty to try "main", then "master"
// ─────────────────────────────────────────────────────────

const host = location.hostname;
if (!USER && host.endsWith(".github.io")) USER = host.split(".")[0];
if (!REPO) REPO = location.pathname.split("/").filter(Boolean)[0] || `${USER}.github.io`;

const IMG = /\.(jpe?g|png|webp|gif|avif)$/i;
const $ = id => document.getElementById(id);
const grid = $("grid"), viewer = $("viewer"), big = $("big");
const slugify = s => s.toLowerCase().replace(/\.[^.\/]+$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const pretty = s => s.replace(/[-_]+/g, " ").replace(/^./, c => c.toUpperCase());
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let all = [], view = [], current = 0, filterHash = "", albumList = [], tagList = [];

async function fetchTree() {
  for (const b of BRANCH ? [BRANCH] : ["main", "master"]) {
    const r = await fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/${b}?recursive=1`);
    if (r.ok) return (await r.json()).tree;
  }
  throw new Error("Repository not found");
}

// tags.txt lines look like:  harbor-at-dusk.jpg: sea, night
async function fetchTags() {
  try {
    const r = await fetch(`${FOLDER}/tags.txt`, { cache: "no-cache" });
    if (!r.ok) return {};
    const map = {};
    (await r.text()).split(/\r?\n/).forEach(line => {
      const i = line.indexOf(":");
      if (i < 0 || line.trim().startsWith("#")) return;
      map[line.slice(0, i).trim().toLowerCase()] =
        line.slice(i + 1).split(",").map(t => t.trim().toLowerCase()).filter(Boolean);
    });
    return map;
  } catch (e) { return {}; }
}

async function load() {
  try {
    const [tree, tags] = await Promise.all([fetchTree(), fetchTags()]);
    all = tree.filter(f => f.type === "blob" && f.path.startsWith(FOLDER + "/") && IMG.test(f.path))
      .map(f => {
        const rel = f.path.slice(FOLDER.length + 1);
        const parts = rel.split("/"), file = parts.pop(), album = parts.join("/");
        return {
          src: f.path.split("/").map(encodeURIComponent).join("/"),
          album,
          tags: tags[rel.toLowerCase()] || tags[file.toLowerCase()] || [],
          slug: slugify((album ? album + "-" : "") + file)
        };
      })
      .sort((a, b) => b.src.localeCompare(a.src));   // newest-named first
    albumList = [...new Set(all.map(p => p.album).filter(Boolean))].sort();
    tagList = [...new Set(all.flatMap(p => p.tags))].sort();
    renderFilters();
    route();
  } catch (e) {
    grid.innerHTML = `<p class="empty">No photos found. Add images to the “${FOLDER}” folder of the repository, or set USER and REPO at the bottom of index.html.</p>`;
  }
}

function renderFilters() {
  $("albums").innerHTML = albumList.length
    ? `<a href="#all" data-f="all">All</a>` +
      albumList.map(a => `<a href="#album-${slugify(a)}" data-f="album-${slugify(a)}">${esc(pretty(a.split("/").pop()))}</a>`).join("")
    : "";
  $("tags").innerHTML = tagList.map(t =>
    `<a href="#tag-${slugify(t)}" data-f="tag-${slugify(t)}">#${esc(t)}</a>`).join("");
}

function setFilter(hash) {
  filterHash = hash === "all" ? "" : hash;
  if (hash.startsWith("album-")) view = all.filter(p => slugify(p.album) === hash.slice(6));
  else if (hash.startsWith("tag-")) view = all.filter(p => p.tags.some(t => slugify(t) === hash.slice(4)));
  else view = all;
  document.querySelectorAll("nav a").forEach(a => {
    const on = a.dataset.f === (filterHash || (albumList.length ? "all" : ""));
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  if (viewer.open) viewer.close();
  renderGrid();
}

function renderGrid() {
  if (!view.length) { grid.innerHTML = `<p class="empty">No photos here yet. Upload images to the “${FOLDER}” folder to fill this page.</p>`; return; }
  grid.innerHTML = "";
  view.forEach((p, i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-label", `Open photo ${i + 1}`);
    b.innerHTML = `<img src="${p.src}" alt="" loading="lazy">`;
    b.onclick = () => open(i);
    grid.appendChild(b);
  });
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const isFilter = h === "all" || albumList.some(a => "album-" + slugify(a) === h) || tagList.some(t => "tag-" + slugify(t) === h);
  if (!h || isFilter) return setFilter(h || "all");
  const p = all.find(p => p.slug === h);
  if (!view.length || (p && !view.includes(p))) setFilter("all");
  if (p) open(view.indexOf(p));
}

function open(i) {
  current = (i + view.length) % view.length;
  const p = view[current];
  big.src = p.src;
  $("count").textContent = `${current + 1} / ${view.length}`;
  $("caption").innerHTML =
    (p.album ? `<a href="#album-${slugify(p.album)}">${esc(pretty(p.album.split("/").pop()))}</a>` : "") +
    p.tags.map(t => `<a href="#tag-${slugify(t)}">#${esc(t)}</a>`).join("");
  history.replaceState(null, "", "#" + p.slug);
  if (!viewer.open) viewer.showModal();
}

viewer.addEventListener("close", () =>
  history.replaceState(null, "", filterHash ? "#" + filterHash : location.pathname));
window.addEventListener("hashchange", route);

const shareBtn = $("share");
shareBtn.onclick = async () => {
  const url = location.href;
  try {
    if (navigator.share) await navigator.share({ url });
    else { await navigator.clipboard.writeText(url); shareBtn.textContent = "Link copied"; setTimeout(() => shareBtn.textContent = "Copy link", 1500); }
  } catch (e) {}
};

$("prev").onclick = () => open(current - 1);
$("next").onclick = () => open(current + 1);
$("close").onclick = () => viewer.close();
big.onclick = () => open(current + 1);
document.addEventListener("keydown", e => {
  if (!viewer.open) return;
  if (e.key === "ArrowRight") open(current + 1);
  if (e.key === "ArrowLeft") open(current - 1);
});

load();
</script>
</body>
</html>
