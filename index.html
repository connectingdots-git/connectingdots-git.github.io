<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photographs</title>
<link rel="preload" href="photos.json" as="fetch" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9EAE6; --ink: #1A1C1A; --muted: #6B6F68; --ph: #DCDDD8; --veil: rgba(20,21,20,.94);
    --gap: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1C1D1B; --ink: #E6E7E2; --muted: #8E928A; --ph: #262725; --veil: rgba(10,10,10,.96); color-scheme: dark; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 300; }

  /* Everything lines up with the edges of the column block, which is centered */
  .wrap { box-sizing: content-box; width: var(--w, auto); margin: 0 auto; padding: 0 var(--pad, 24px); }
  header { padding: clamp(2rem, 8vw, 5rem) 0 2rem; }
  h1 { font-weight: 600; font-size: clamp(2.5rem, 9vw, 6rem); line-height: .9; letter-spacing: -.03em; }
  header p { margin-top: 1rem; color: var(--muted); max-width: 32rem; line-height: 1.5; }

  nav { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; }
  nav:empty { display: none; }
  nav a { color: var(--muted); text-decoration: none; padding: .25rem 0; }
  nav a:hover, nav a[aria-current] { color: var(--ink); }
  nav a[aria-current] { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .3em; }
  #albums { font-size: clamp(1.125rem, 2.2vw, 1.5rem); font-weight: 600; letter-spacing: -.01em; }
  #tags { font-size: .9375rem; padding-top: .5rem; }
  .filters { padding-bottom: 1.75rem; }

  #grid { display: flex; gap: var(--gap); align-items: flex-start; padding-bottom: 4rem; }
  .col { width: var(--col, 191px); flex: none; display: flex; flex-direction: column; gap: var(--gap); }
  .thumb { display: block; width: 100%; padding: 0; border: 0; background: var(--ph); cursor: zoom-in; line-height: 0; }
  .thumb img { display: block; width: 100%; height: auto; opacity: 0; }
  .thumb img.in { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) { .thumb img { transition: opacity .25s; } }
  a:focus-visible, .thumb:focus-visible, dialog button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  .empty { color: var(--muted); line-height: 1.5; max-width: 32rem; }

  dialog { border: 0; padding: 0; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; background: var(--veil); color: #E6E7E2; }
  dialog[open] { display: grid; place-items: center; }
  dialog img { max-width: 92vw; max-height: 80vh; object-fit: contain; }
  dialog .bar { position: fixed; bottom: 1rem; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .25rem 1.5rem; padding: 0 1rem; }
  dialog button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: .5rem; }
  dialog .count { color: #8E928A; font-variant-numeric: tabular-nums; }
  #caption { position: fixed; top: 1rem; left: 0; right: 0; text-align: center; color: #8E928A; font-size: .9375rem; }
  #caption a { color: #E6E7E2; text-decoration: none; margin: 0 .4rem; }
  #caption a:hover { text-decoration: underline; }
  footer { padding-bottom: 3rem; color: var(--muted); font-size: .875rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>.</h1>
    <p>Old fashioned digital photography with a camera and minimal editing.</p>
  </header>
  <div class="filters">
    <nav id="albums" aria-label="Albums"></nav>
    <nav id="tags" aria-label="Tags"></nav>
  </div>
  <main id="grid"><p class="empty">Loading photos…</p></main>
  <footer>© Adrian Ilie</footer>
</div>

<dialog id="viewer" aria-label="Photo viewer">
  <div id="caption"></div>
  <img id="big" alt="">
  <div class="bar">
    <button id="prev" aria-label="Previous photo">Previous</button>
    <span class="count" id="count"></span>
    <button id="next" aria-label="Next photo">Next</button>
    <button id="share" aria-label="Copy link to this photo">Copy link</button>
    <button id="close" aria-label="Close viewer">Close</button>
  </div>
</dialog>

<script>
// ── Settings ─────────────────────────────────────────────
const COL = 191;      // column width in pixels
const GAP = 10;       // space between columns (and between photos in a column)
const MIN_COLS = 2;   // on screens too narrow for this many, columns shrink to fit. Set to 1 to never shrink.
// ─────────────────────────────────────────────────────────

const $ = id => document.getElementById(id);
const root = document.documentElement;
const grid = $("grid"), viewer = $("viewer"), big = $("big");
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const pretty = s => s.replace(/[-_]+/g, " ").replace(/^./, c => c.toUpperCase());
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let all = [], view = [], current = 0, filterHash = "", albumList = [], tagList = [];
let cols = 0, colW = 0;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

async function load() {
  try {
    const r = await fetch("photos.json");
    if (!r.ok) throw new Error(r.status);
    all = shuffle(await r.json());
  } catch (e) {
    grid.innerHTML = `<p class="empty">No photo list found yet. The gallery is built by GitHub Actions: check the Actions tab of your repository for a green tick, then reload this page.</p>`;
    return;
  }
  all.forEach(p => {
    const b = document.createElement("button");
    b.className = "thumb";
    b.setAttribute("aria-label", "Open photo");
    const img = new Image();
    img.onload = () => img.classList.add("in");
    img.width = p.w; img.height = p.h;          // reserves the space, so nothing jumps while loading
    img.alt = ""; img.decoding = "async"; img.loading = "lazy";
    img.src = p.thumb;
    b.appendChild(img);
    b.onclick = () => open(view.indexOf(p));
    p.node = b;
  });
  albumList = [...new Set(all.map(p => p.album).filter(Boolean))].sort();
  tagList = [...new Set(all.flatMap(p => p.tags))].sort();
  renderFilters();
  route();
}

// Place each photo in whichever column is currently shortest
function layout(force) {
  const pad = innerWidth < 600 ? 12 : 24;
  const avail = root.clientWidth - pad * 2;
  let n = Math.max(1, Math.floor((avail + GAP) / (COL + GAP)));
  let w = COL;
  if (n < MIN_COLS) { n = MIN_COLS; w = Math.floor((avail - GAP * (n - 1)) / n); }
  if (n === cols && w === colW && !force) return;
  cols = n; colW = w;
  root.style.setProperty("--pad", pad + "px");
  root.style.setProperty("--col", w + "px");
  root.style.setProperty("--w", (n * w + (n - 1) * GAP) + "px");
  root.style.setProperty("--gap", GAP + "px");
  if (!view.length) {
    grid.innerHTML = `<p class="empty">No photos here yet. Upload images to the “photos” folder to fill this page.</p>`;
    return;
  }
  const columns = Array.from({ length: n }, () => Object.assign(document.createElement("div"), { className: "col" }));
  const heights = new Array(n).fill(0);
  view.forEach((p, i) => {
    const c = heights.indexOf(Math.min(...heights));
    columns[c].appendChild(p.node);
    heights[c] += w * p.h / p.w + GAP;
    if (i < n * 4) p.node.firstChild.loading = "eager";   // first screenful loads straight away
  });
  grid.replaceChildren(...columns);
}

let raf;
addEventListener("resize", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => layout()); });

function renderFilters() {
  $("albums").innerHTML = albumList.length
    ? `<a href="#all" data-f="all">All</a>` +
      albumList.map(a => `<a href="#album-${slugify(a)}" data-f="album-${slugify(a)}">${esc(pretty(a.split("/").pop()))}</a>`).join("")
    : "";
  $("tags").innerHTML = tagList.map(t =>
    `<a href="#tag-${slugify(t)}" data-f="tag-${slugify(t)}">#${esc(t)}</a>`).join("");
}

function setFilter(hash) {
  filterHash = hash === "all" ? "" : hash;
  if (hash.startsWith("album-")) view = all.filter(p => slugify(p.album) === hash.slice(6));
  else if (hash.startsWith("tag-")) view = all.filter(p => p.tags.some(t => slugify(t) === hash.slice(4)));
  else view = all;
  document.querySelectorAll("nav a").forEach(a => {
    const on = a.dataset.f === (filterHash || (albumList.length ? "all" : ""));
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  if (viewer.open) viewer.close();
  layout(true);
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const isFilter = h === "all" || albumList.some(a => "album-" + slugify(a) === h) || tagList.some(t => "tag-" + slugify(t) === h);
  if (!h || isFilter) return setFilter(h || "all");
  const p = all.find(p => p.slug === h);
  if (!view.length || (p && !view.includes(p))) setFilter("all");
  if (p) open(view.indexOf(p));
}

function open(i) {
  current = (i + view.length) % view.length;
  const p = view[current];
  big.src = p.large;
  new Image().src = view[(current + 1) % view.length].large;   // preload the next one
  $("count").textContent = `${current + 1} / ${view.length}`;
  $("caption").innerHTML =
    (p.album ? `<a href="#album-${slugify(p.album)}">${esc(pretty(p.album.split("/").pop()))}</a>` : "") +
    p.tags.map(t => `<a href="#tag-${slugify(t)}">#${esc(t)}</a>`).join("");
  history.replaceState(null, "", "#" + p.slug);
  if (!viewer.open) viewer.showModal();
}

viewer.addEventListener("close", () =>
  history.replaceState(null, "", filterHash ? "#" + filterHash : location.pathname));
addEventListener("hashchange", route);

const shareBtn = $("share");
shareBtn.onclick = async () => {
  // Preview page link (/p/<slug>/) so chat apps show this photo; it redirects back here
  const base = location.origin + location.pathname.replace(/[^/]*$/, "");
  const url = `${base}p/${view[current].slug}/`;
  try {
    if (navigator.share) await navigator.share({ url });
    else { await navigator.clipboard.writeText(url); shareBtn.textContent = "Link copied"; setTimeout(() => shareBtn.textContent = "Copy link", 1500); }
  } catch (e) {}
};

$("prev").onclick = () => open(current - 1);
$("next").onclick = () => open(current + 1);
$("close").onclick = () => viewer.close();
big.onclick = () => open(current + 1);
document.addEventListener("keydown", e => {
  if (!viewer.open) return;
  if (e.key === "ArrowRight") open(current + 1);
  if (e.key === "ArrowLeft") open(current - 1);
});

load();
</script>
</body>
</html>
